<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CoPED PULSE · Connect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F9FAFB;
            color: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            border: 2px solid #111827;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            padding: 24px;
        }
        .brand {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #059669;
            margin-bottom: 6px;
        }
        h1 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
        p { font-size: 13px; color: #4B5563; line-height: 1.5; margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #111827;
        }
        input {
            width: 100%;
            min-height: 44px;
            border: 2px solid #111827;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            background: #FFFFFF;
        }
        .btn-primary {
            width: 100%;
            min-height: 46px;
            background: #111827;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-secondary {
            width: 100%;
            min-height: 42px;
            background: #F3F4F6;
            color: #111827;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .status {
            font-size: 12px;
            font-weight: 700;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            background: #EFF6FF;
            border: 1.5px solid #BFDBFE;
            color: #1D4ED8;
        }
        .status.error {
            background: #FEF3C7;
            border-color: #F59E0B;
            color: #92400E;
        }
        .hint {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1.5px solid #E5E7EB;
            font-size: 12px;
            color: #6B7280;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">UUM CoPED · Mobile App</div>
        <h1>CoPED PULSE</h1>
        <p>Connect to your CoPED PULSE Laravel server on your laptop or cloud host.</p>

        <div id="status" class="status">Checking server connection...</div>

        <form id="server-form">
            <label for="server-url">Server URL</label>
            <input
                id="server-url"
                type="url"
                placeholder="http://192.168.1.100:8081"
                required
            />
            <button type="submit" class="btn-primary">Connect &amp; Launch</button>
        </form>

        <button type="button" id="emulator-btn" class="btn-secondary">
            Use Android Emulator (http://10.0.2.2:8081)
        </button>

        <div class="hint">
            <strong>Quick Tip:</strong> Start your backend with <code>bash scripts/serve-mobile.sh</code>, then enter your laptop's Wi-Fi IP (for a physical phone) or tap <strong>Use Android Emulator</strong>.
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'coped_server_url';
        const DEFAULT_URL = 'http://10.0.2.2:8081';

        const input = document.getElementById('server-url');
        const statusEl = document.getElementById('status');
        const form = document.getElementById('server-form');
        const emulatorBtn = document.getElementById('emulator-btn');

        function normalizeUrl(raw) {
            return raw.trim().replace(/\/+$/, '');
        }

        async function connectTo(rawUrl) {
            const url = normalizeUrl(rawUrl);
            if (!/^https?:\/\/.+/i.test(url)) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Please enter a valid http:// or https:// URL.';
                return;
            }

            localStorage.setItem(STORAGE_KEY, url);
            input.value = url;
            statusEl.className = 'status';
            statusEl.textContent = 'Connecting to ' + url + ' ...';

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 3000);

            try {
                await fetch(url + '/manifest.json', { mode: 'no-cors', signal: controller.signal });
                clearTimeout(timer);
                window.location.replace(url);
            } catch (err) {
                clearTimeout(timer);
                statusEl.className = 'status error';
                statusEl.textContent = 'Could not reach ' + url + '. Make sure serve-mobile.sh is running and both devices share the same Wi-Fi.';
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            connectTo(input.value);
        });

        emulatorBtn.addEventListener('click', () => {
            connectTo(DEFAULT_URL);
        });

        const params = new URLSearchParams(window.location.search);
        const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_URL;
        input.value = saved;

        if (!params.has('setup')) {
            connectTo(saved);
        } else {
            statusEl.textContent = 'Enter your server URL below.';
        }
    </script>
</body>
</html>
